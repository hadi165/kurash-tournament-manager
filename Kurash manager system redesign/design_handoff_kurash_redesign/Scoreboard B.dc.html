<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700;900&display=swap">
  <style>
    html, body { margin: 0; background: #05070a; }
    a { color: #4fbce8; } a:hover { color: #93d7f2; }
  </style>
</helmet>
<div data-screen-label="Scoreboard B" style="width:1920px; height:1080px; background:#05070a; color:#fff; font-family:'Source Sans 3', system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden">

  <header style="flex:0 0 96px; display:flex; align-items:center; justify-content:space-between; padding:0 40px; background:#0a0e13">
    <div style="display:flex; align-items:center; gap:18px">
      <div style="background:#fff; padding:6px; border-radius:9px; flex:none"><img src="uploads/IKA.png" alt="IKA" style="width:46px; height:46px; object-fit:contain; display:block"></div>
      <div style="font-size:26px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#93a2b4">Asian Kurash Championship 2026</div>
    </div>
    <div style="display:flex; align-items:center; gap:20px">
      <span style="{{ chipStyle }}">{{ matLabel }}</span>
      <span style="{{ chipStyle }}">{{ phase }}</span>
      <span style="{{ chipAccentStyle }}">{{ divisionLabel }} · {{ weightLabel }}</span>
    </div>
  </header>

  <sc-if value="{{ idle }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1; display:grid; place-items:center; font-size:72px; font-weight:700; color:#39434f; letter-spacing:0.04em">No contest on this mat</div>
  </sc-if>

  <sc-if value="{{ live }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; min-height:0">
      <sc-for list="{{ sides }}" as="s" hint-placeholder-count="2">
        <div style="{{ s.paneStyle }}">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:20px">
            <span style="{{ s.cornerTagStyle }}">{{ s.cornerLabel }}</span>
            <sc-if value="{{ s.showWinner }}" hint-placeholder-val="{{ false }}">
              <span style="{{ s.winnerTagStyle }}">WINNER</span>
            </sc-if>
          </div>
          <div style="display:flex; align-items:center; gap:26px; margin-top:26px">
            <div style="{{ s.flagStyle }}">{{ s.noc }}</div>
            <div style="min-width:0">
              <div style="font-size:66px; font-weight:900; line-height:1.02; letter-spacing:-0.02em; text-transform:uppercase; overflow-wrap:anywhere">{{ s.name }}</div>
              <div style="font-size:26px; font-weight:600; color:#8d9cae; margin-top:8px">{{ s.country }}</div>
            </div>
          </div>
          <div style="flex:1"></div>
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:14px">
            <sc-for list="{{ s.cells }}" as="c" hint-placeholder-count="4">
              <div style="{{ c.style }}">
                <div style="font-size:96px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums">{{ c.value }}</div>
                <div style="font-size:22px; font-weight:700; letter-spacing:0.1em; color:#8d9cae; margin-top:6px; text-transform:uppercase">{{ c.label }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <footer style="flex:0 0 210px; display:flex; align-items:center; justify-content:center; background:#000; border-top:3px solid #151c24">
      <div style="{{ clockStyle }}">{{ clock }}</div>
    </footer>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080},
  &quot;state&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;live&quot;, &quot;options&quot;: [&quot;live&quot;, &quot;winner&quot;, &quot;idle&quot;], &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  state = { left: 152, running: true };
  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.running) return;
      this.setState(s => ({ left: Math.max(0, s.left - 1) }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const state = this.props.state ?? 'live';
    const winnerSide = state === 'winner' ? 'blue' : null;
    const left = this.state.left;
    const clock = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    const urgent = left <= 20;
    const chip = extra => ({ display: 'inline-flex', alignItems: 'center', padding: '8px 22px', borderRadius: '999px',
      fontSize: '24px', fontWeight: 700, letterSpacing: '0.04em', background: '#141b23', color: '#c8d3e0', ...extra });
    const mk = (corner, name, noc, country, tally) => {
      const isWinner = winnerSide === corner;
      const accent = corner === 'blue' ? '#1a9fd8' : '#019a44';
      const soft = corner === 'blue' ? '#0b1d2b' : '#0a2015';
      const cell = (label, value, dim) => ({ label, value, style: {
        background: dim ? '#0b1016' : '#111923', borderRadius: '14px', padding: '18px 0',
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        color: dim ? '#4d5a68' : '#fff', border: '2px solid ' + (dim ? '#141c24' : '#1d2833') } });
      return {
        name, noc, country,
        cornerLabel: corner === 'blue' ? 'Blue' : 'Green',
        paneStyle: { display: 'flex', flexDirection: 'column', padding: '32px 40px 36px',
          background: isWinner ? soft : '#080b10',
          borderTop: '10px solid ' + accent,
          borderRight: corner === 'blue' ? '3px solid #151c24' : 'none' },
        cornerTagStyle: chip({ background: accent, color: '#fff', letterSpacing: '0.12em', textTransform: 'uppercase' }),
        showWinner: isWinner,
        winnerTagStyle: chip({ background: '#fff', color: '#05070a', fontSize: '34px', fontWeight: 900, letterSpacing: '0.08em', padding: '10px 30px' }),
        // Flag slot. The real board loads asset("flags/{iso}.svg"); those SVGs are not
        // committed to the repo, so the mock shows the documented no-flag fallback.
        flagStyle: { width: '164px', height: '110px', flex: 'none', borderRadius: '12px',
          border: '2px solid #202a36', display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '44px', fontWeight: 900, color: '#fff',
          background: 'repeating-linear-gradient(135deg, #171e27 0 10px, #1e262f 10px 20px)' },
        cells: [cell('Yonbosh', tally[0]), cell('Chala', tally[1]), cell('Dakki', tally[2], tally[2] === 0), cell('Tanbeh', tally[3], tally[3] === 0)],
      };
    };
    return {
      idle: state === 'idle', live: state !== 'idle',
      matLabel: 'Mat 1 · No.43', phase: 'Quarterfinal',
      weightLabel: '-66 kg', divisionLabel: 'Men Senior',
      chipStyle: chip({}), chipAccentStyle: chip({ background: '#0e2a1a', color: '#3dbd6f' }),
      clock,
      clockStyle: { fontFamily: 'ui-monospace, "DejaVu Sans Mono", monospace', fontSize: '156px', fontWeight: 700,
        lineHeight: 1, color: urgent ? '#ff2a17' : '#ff5b3c', fontVariantNumeric: 'tabular-nums', letterSpacing: '0.02em' },
      sides: [mk('blue', 'Ulugbek Rashidov', 'UZB', 'Uzbekistan', [1, 2, 0, 1]), mk('green', 'Daniyar Seit', 'KAZ', 'Kazakhstan', [0, 1, 0, 2])],
    };
  }
}
</script>
</body>
</html>
