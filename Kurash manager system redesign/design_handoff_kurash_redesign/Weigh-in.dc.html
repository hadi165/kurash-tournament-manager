<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-ade95aec-3268-4197-bc69-ddbb127c7df0/styles.css">
  <link rel="stylesheet" href="kurash-theme.css">
  <script src="_ds/modernist-ade95aec-3268-4197-bc69-ddbb127c7df0/_ds_bundle.js"></script>
</helmet>
<div data-theme="{{ theme }}" data-screen-label="Weigh-in" style="display:flex; min-height:100vh; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body)">
  <dc-import name="Sidebar" active="Weigh-in Form" hint-size="252px,100%"></dc-import>
  <main style="flex:1; min-width:0; display:flex; flex-direction:column">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:10px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="font-size:13px; display:flex; align-items:center; gap:8px">
        <a href="Championships.dc.html" style="font-weight:600; text-decoration:none">Championships</a>
        <span class="text-muted">/</span>
        <a href="Categories.dc.html" style="font-weight:600; text-decoration:none">Asian Kurash Championship 2026</a>
        <span class="text-muted">/</span>
        <span style="font-weight:600" class="text-muted">Weigh-in</span>
      </div>
      <button class="btn btn-secondary" style="font-size:12px; padding:4px 12px" onClick="{{ toggleTheme }}">{{ themeBtnLabel }}</button>
    </div>
    <header style="padding:28px 32px 0">
      <div class="kicker" style="color:var(--color-accent-600)">Men Senior</div>
      <h1 style="font-size:36px; margin:8px 0 4px">Weigh-in</h1>
      <p class="text-muted" style="font-size:14px; margin:0">A 0.5 kg tolerance applies below an upper limit. Open classes have no upper bound.</p>
    </header>
    <div style="padding:22px 32px 48px; display:flex; flex-direction:column; gap:20px; max-width:1240px">
      <section style="background:var(--color-surface); border:1px solid var(--color-neutral-300); box-shadow:var(--shadow-sm)">
        <div style="padding:16px 20px; display:flex; flex-direction:column; gap:6px; max-width:300px">
          <label class="kicker">Weight class</label>
          <select class="input" value="{{ filter }}" onChange="{{ onFilter }}">
            <option value="">All classes</option>
            <option value="-60">-60 kg</option>
            <option value="-66">-66 kg</option>
            <option value="-73">-73 kg</option>
            <option value="-81">-81 kg</option>
            <option value="-90">-90 kg</option>
            <option value="+90">+90 kg</option>
          </select>
        </div>
        <table class="table" style="width:100%">
          <thead>
            <tr><th>IKA ID</th><th>Name</th><th>NOC</th><th>Class</th><th>Measured</th><th>Result</th></tr>
          </thead>
          <tbody>
            <sc-for list="{{ rows }}" as="a" hint-placeholder-count="8">
              <tr>
                <td style="font-family:monospace; font-size:12px">{{ a.id }}</td>
                <td style="font-weight:700">{{ a.name }}</td>
                <td><span style="display:inline-block; padding:1px 6px; border:1px solid var(--color-neutral-400); font-size:11px; font-weight:700">{{ a.noc }}</span></td>
                <td>{{ a.weight }}</td>
                <td>
                  <div style="display:flex; align-items:center; gap:8px">
                    <input class="input" type="number" step="0.01" min="0" style="width:110px" value="{{ a.input }}" onChange="{{ a.onInput }}">
                    <button class="btn btn-secondary" style="font-size:12px; padding:4px 12px" onClick="{{ a.onSave }}">Save</button>
                  </div>
                </td>
                <td><span class="tag" style="{{ a.badgeStyle }}">{{ a.badge }}</span></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;dark&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    themeOverride: null, filter: '', inputs: {},
    athletes: [
      { id: 'IKA-26-0102', name: 'Ulugbek Rashidov', noc: 'UZB', weight: '-66', kg: 65.8 },
      { id: 'IKA-26-0117', name: 'Daniyar Seit', noc: 'KAZ', weight: '-66', kg: null },
      { id: 'IKA-26-0089', name: 'Emil Asanov', noc: 'KGZ', weight: '-73', kg: 72.9 },
      { id: 'IKA-26-0141', name: 'Firdavs Nazarov', noc: 'TJK', weight: '-60', kg: 61.2 },
      { id: 'IKA-26-0056', name: 'Jasur Malikov', noc: 'UZB', weight: '-81', kg: 80.4 },
      { id: 'IKA-26-0163', name: 'Bat-Erdene Gan', noc: 'MGL', weight: '-90', kg: null },
      { id: 'IKA-26-0075', name: 'Reza Karimi', noc: 'IRI', weight: '+90', kg: 97.2 },
      { id: 'IKA-26-0128', name: 'Arjun Patel', noc: 'IND', weight: '-73', kg: 72.4 },
    ],
  };
  passes(weight, kg) {
    if (kg === null) return null;
    if (weight.startsWith('+')) return true; // open upper class
    return kg <= Math.abs(parseFloat(weight)) + 0.5;
  }
  renderVals() {
    const theme = this.state.themeOverride ?? this.props.theme ?? 'dark';
    const shown = this.state.athletes.filter(a => !this.state.filter || a.weight === this.state.filter);
    return {
      theme, themeBtnLabel: theme === 'dark' ? 'Light mode' : 'Dark mode',
      toggleTheme: () => this.setState({ themeOverride: theme === 'dark' ? 'light' : 'dark' }),
      filter: this.state.filter, onFilter: e => this.setState({ filter: e.target.value }),
      rows: shown.map(a => {
        const pass = this.passes(a.weight, a.kg);
        return {
          ...a,
          input: this.state.inputs[a.id] ?? (a.kg ?? ''),
          onInput: e => this.setState(s => ({ inputs: { ...s.inputs, [a.id]: e.target.value } })),
          onSave: () => {
            const v = parseFloat(this.state.inputs[a.id]);
            if (isNaN(v) || v <= 0) return;
            this.setState(s => ({ athletes: s.athletes.map(x => x.id === a.id ? { ...x, kg: v } : x) }));
          },
          badge: pass === null ? 'NOT WEIGHED' : pass ? 'PASSED' : 'OUTSIDE CLASS',
          badgeStyle: pass === null
            ? { background: 'transparent', border: '1px solid var(--color-neutral-400)', color: 'var(--color-text)' }
            : pass
              ? { background: 'var(--color-accent-200)', color: 'var(--color-accent-800)' }
              : { background: 'var(--color-danger-200)', color: 'var(--color-danger-700)' },
        };
      }),
    };
  }
}
</script>
</body>
</html>
