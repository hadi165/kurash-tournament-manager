<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700;900&display=swap">
  <style>
    html, body { margin: 0; background: #05070a; }
    a { color: #4fbce8; } a:hover { color: #93d7f2; }
  </style>
</helmet>
<div data-screen-label="Scoreboard A" style="width:1920px; height:1080px; background:#05070a; color:#fff; font-family:'Source Sans 3', system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden">

  <header style="flex:0 0 152px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:32px; padding:0 44px; background:#0b0f15; border-bottom:2px solid #1b222c">
    <div style="display:flex; align-items:center; gap:22px">
      <div style="background:#fff; padding:7px; border-radius:10px; flex:none"><img src="uploads/IKA.png" alt="IKA" style="width:62px; height:62px; object-fit:contain; display:block"></div>
      <div>
        <div style="font-size:44px; font-weight:900; line-height:1; letter-spacing:-0.01em">{{ matLabel }}</div>
        <div style="font-size:22px; font-weight:600; color:#8a99ab; margin-top:6px; letter-spacing:0.08em; text-transform:uppercase">{{ phase }}</div>
      </div>
    </div>
    <div style="{{ clockStyle }}">{{ clock }}</div>
    <div style="text-align:right">
      <div style="font-size:44px; font-weight:900; line-height:1">{{ weightLabel }}</div>
      <div style="font-size:22px; font-weight:600; color:#8a99ab; margin-top:6px; letter-spacing:0.08em; text-transform:uppercase">{{ divisionLabel }}</div>
    </div>
  </header>

  <sc-if value="{{ idle }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1; display:grid; place-items:center; font-size:64px; font-weight:700; color:#3a4552; letter-spacing:0.04em">No contest on this mat</div>
  </sc-if>

  <sc-if value="{{ live }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1; display:flex; flex-direction:column">
      <sc-for list="{{ sides }}" as="s" hint-placeholder-count="2">
        <div style="{{ s.rowStyle }}">
          <div style="{{ s.cornerStyle }}"></div>
          <div style="flex:1; min-width:0; display:flex; align-items:center; gap:30px; padding-left:36px">
            <div style="{{ s.flagStyle }}">{{ s.noc }}</div>
            <div style="min-width:0">
              <div style="font-size:76px; font-weight:900; line-height:1.02; letter-spacing:-0.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase">{{ s.name }}</div>
              <div style="{{ s.cornerTagStyle }}">{{ s.cornerLabel }}</div>
            </div>
          </div>
          <sc-if value="{{ s.showWinner }}" hint-placeholder-val="{{ false }}">
            <div style="{{ s.winnerStyle }}">WINNER</div>
          </sc-if>
          <div style="display:flex; align-self:stretch">
            <sc-for list="{{ s.cells }}" as="c" hint-placeholder-count="4">
              <div style="{{ c.style }}">
                <div style="font-size:106px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums">{{ c.value }}</div>
                <div style="font-size:22px; font-weight:700; letter-spacing:0.14em; color:#7b8798; margin-top:4px">{{ c.key }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <footer style="flex:0 0 74px; display:flex; align-items:center; justify-content:space-between; padding:0 44px; background:#0b0f15; border-top:2px solid #1b222c">
      <div style="display:flex; gap:34px; font-size:20px; font-weight:600; color:#8a99ab; letter-spacing:0.04em">
        <span><span style="color:#fff; font-weight:900">Y</span> Yonbosh</span>
        <span><span style="color:#fff; font-weight:900">C</span> Chala</span>
        <span><span style="color:#fff; font-weight:900">D</span> Dakki</span>
        <span><span style="color:#fff; font-weight:900">T</span> Tanbeh</span>
      </div>
      <div style="font-size:20px; font-weight:700; color:#8a99ab; letter-spacing:0.1em; text-transform:uppercase">Asian Kurash Championship 2026 · Tashkent</div>
    </footer>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080},
  &quot;state&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;live&quot;, &quot;options&quot;: [&quot;live&quot;, &quot;winner&quot;, &quot;idle&quot;], &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  state = { left: 152, running: true };
  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.running) return;
      this.setState(s => ({ left: Math.max(0, s.left - 1) }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const state = this.props.state ?? 'live';
    const winnerSide = state === 'winner' ? 'blue' : null;
    const left = this.state.left;
    const clock = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    const urgent = left <= 20;
    const mk = (corner, name, noc, tally) => {
      const isWinner = winnerSide === corner;
      const accent = corner === 'blue' ? '#1a9fd8' : '#019a44';
      const cell = (key, value, dim) => ({ key, value, style: {
        width: '170px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        borderLeft: '2px solid #161d26', background: dim ? '#0b0f15' : '#0e131a', color: dim ? '#54606f' : '#fff' } });
      return {
        name, noc, cornerLabel: corner === 'blue' ? 'Blue corner' : 'Green corner',
        rowStyle: { flex: '1 1 0', display: 'flex', alignItems: 'center', minHeight: 0,
          background: isWinner ? (corner === 'blue' ? '#0c1c28' : '#0b1f14') : '#080b10',
          borderBottom: corner === 'blue' ? '2px solid #1b222c' : 'none' },
        cornerStyle: { width: '18px', alignSelf: 'stretch', background: accent, flex: 'none' },
        // Flag slot. The real board loads asset("flags/{iso}.svg"); those SVGs are not
        // committed to the repo, so the mock shows the documented no-flag fallback.
        flagStyle: { width: '150px', height: '100px', flex: 'none', borderRadius: '10px',
          border: '2px solid #232c38', display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '40px', fontWeight: 900, letterSpacing: '0.02em', color: '#fff',
          background: 'repeating-linear-gradient(135deg, #171e27 0 10px, #1e262f 10px 20px)' },
        cornerTagStyle: { display: 'inline-block', marginTop: '10px', padding: '4px 16px', borderRadius: '999px',
          background: accent, color: '#fff', fontSize: '20px', fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase' },
        showWinner: isWinner,
        winnerStyle: { flex: 'none', margin: '0 30px', padding: '16px 40px', borderRadius: '14px', background: accent,
          color: '#fff', fontSize: '54px', fontWeight: 900, letterSpacing: '0.06em' },
        cells: isWinner
          ? [cell('Y', tally[0]), cell('T', tally[3])]
          : [cell('Y', tally[0]), cell('C', tally[1]), cell('D', tally[2], tally[2] === 0), cell('T', tally[3], tally[3] === 0)],
      };
    };
    return {
      idle: state === 'idle', live: state !== 'idle',
      matLabel: 'Mat 1 / No.43', phase: 'Quarterfinal',
      weightLabel: '-66 kg', divisionLabel: 'Men Senior',
      clock,
      clockStyle: { fontFamily: 'ui-monospace, "DejaVu Sans Mono", monospace', fontSize: '108px', fontWeight: 700,
        lineHeight: 1, color: urgent ? '#ff2a17' : '#ff5b3c', fontVariantNumeric: 'tabular-nums',
        letterSpacing: '0.01em', padding: '6px 34px', borderRadius: '14px', background: '#000',
        border: '3px solid ' + (urgent ? '#ff2a17' : '#1c2330') },
      sides: [mk('blue', 'Ulugbek Rashidov', 'UZB', [1, 2, 0, 1]), mk('green', 'Daniyar Seit', 'KAZ', [0, 1, 0, 2])],
    };
  }
}
</script>
</body>
</html>
