<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="kurash-soft.css">
</helmet>
<aside style="width:264px; flex:none; display:flex; flex-direction:column; padding:16px 12px; gap:4px; min-height:100vh">
  <div style="display:flex; align-items:center; gap:10px; padding:8px 10px 14px">
    <div style="background:#fff; padding:5px; border-radius:var(--s-r-md); box-shadow:var(--s-sh-sm); flex:none"><img src="uploads/IKA.png" alt="IKA logo" style="width:32px; height:32px; object-fit:contain; display:block"></div>
    <div>
      <div style="font-size:14px; font-weight:700; line-height:1.2">IKA Manager</div>
      <div style="font-size:11.5px; color:var(--s-muted)">Kurash Association</div>
    </div>
  </div>
  <div style="font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--s-muted); padding:10px 12px 6px">Platform</div>
  <sc-for list="{{ platformItems }}" as="it" hint-placeholder-count="3">
    <a href="{{ it.href }}" style="{{ it.style }}" style-hover="background:var(--s-line-soft)">{{ it.label }}</a>
  </sc-for>
  <div style="font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--s-muted); padding:16px 12px 6px">Asian Kurash 2026</div>
  <sc-for list="{{ champItems }}" as="it" hint-placeholder-count="7">
    <a href="{{ it.href }}" style="{{ it.style }}" style-hover="background:var(--s-line-soft)">{{ it.label }}</a>
  </sc-for>
  <div style="flex:1"></div>
  <div style="display:flex; align-items:center; gap:10px; padding:12px; border-radius:var(--s-r-md); background:var(--s-surface); box-shadow:var(--s-sh-sm)">
    <div style="width:32px; height:32px; flex:none; border-radius:var(--s-r-pill); background:var(--s-green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px">H</div>
    <div style="min-width:0">
      <div style="font-size:13.5px; font-weight:600; line-height:1.2">Hadi</div>
      <div style="font-size:11.5px; color:var(--s-muted)">Organizer</div>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 270, &quot;height&quot;: 900}, &quot;active&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Dashboard&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? '';
    const mk = (label, href) => ({ label, href, style: {
      display: 'block', padding: '9px 12px', fontSize: '13.5px', textDecoration: 'none',
      borderRadius: 'var(--s-r-sm)', color: active === label ? 'var(--s-green-deep)' : 'var(--s-text)',
      fontWeight: active === label ? 600 : 500,
      background: active === label ? 'var(--s-green-soft)' : 'transparent',
    }});
    return {
      platformItems: [mk('Dashboard', 'Dashboard v2.dc.html'), mk('Championships', 'Championships v2.dc.html'), mk('Archive', 'Archive v2.dc.html')],
      champItems: [mk('Categories', 'Categories v2.dc.html'), mk('Athlete Registration', 'Registration v2.dc.html'), mk('Weigh-in Form', 'Weigh-in v2.dc.html'), mk('Entries', 'Entries v2.dc.html'), mk('Fight Order', 'Fight Order v2.dc.html'), mk('Mats', 'Mats v2.dc.html'), mk('Results & Medals', 'Medals v2.dc.html')],
    };
  }
}
</script>
</body>
</html>
