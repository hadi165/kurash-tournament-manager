<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-ade95aec-3268-4197-bc69-ddbb127c7df0/styles.css">
  <link rel="stylesheet" href="kurash-theme.css">
  <script src="_ds/modernist-ade95aec-3268-4197-bc69-ddbb127c7df0/_ds_bundle.js"></script>
</helmet>
<div data-theme="{{ theme }}" data-screen-label="Championship Management" style="display:flex; min-height:100vh; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body)">
  <dc-import name="Sidebar" active="Championship Management" hint-size="252px,100%"></dc-import>
  <main style="flex:1; min-width:0; display:flex; flex-direction:column">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:10px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="font-size:13px; font-weight:600" class="text-muted">Platform</div>
      <button class="btn btn-secondary" style="font-size:12px; padding:4px 12px" onClick="{{ toggleTheme }}">{{ themeBtnLabel }}</button>
    </div>
    <header style="padding:28px 32px 0">
      <div class="kicker" style="color:var(--color-accent-600)">International Kurash Association</div>
      <h1 style="font-size:36px; margin:8px 0 4px">Championships</h1>
      <p class="text-muted" style="font-size:14px; margin:0">Define a tournament before adding categories, athletes or draws.</p>
    </header>
    <div style="padding:22px 32px 48px; display:flex; flex-direction:column; gap:20px; max-width:1240px">
      <section style="background:var(--color-surface); border:1px solid var(--color-neutral-300); box-shadow:var(--shadow-sm); padding:22px 24px">
        <h4 style="margin:0">New championship</h4>
        <div style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:16px; margin:18px 0">
          <div style="display:flex; flex-direction:column; gap:6px">
            <label class="kicker">Title</label>
            <input class="input" placeholder="Asian Kurash Championship 2026">
          </div>
          <div style="display:flex; flex-direction:column; gap:6px">
            <label class="kicker">Location</label>
            <input class="input" placeholder="Tashkent">
          </div>
          <div style="display:flex; flex-direction:column; gap:6px">
            <label class="kicker">Start date</label>
            <input class="input" type="date">
          </div>
        </div>
        <button class="btn btn-primary">Create championship</button>
      </section>
      <section style="background:var(--color-surface); border:1px solid var(--color-neutral-300); box-shadow:var(--shadow-sm)">
        <table class="table" style="width:100%">
          <thead>
            <tr>
              <th>Title</th><th>Location</th><th>Starts</th><th style="text-align:right">Categories</th><th style="text-align:right">Athletes</th><th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><a href="Categories.dc.html" style="font-weight:700">Asian Kurash Championship 2026</a></td>
              <td class="text-muted">Tashkent</td>
              <td class="text-muted">12 Sep 2026</td>
              <td style="text-align:right">2</td>
              <td style="text-align:right">168</td>
              <td style="text-align:right">
                <div style="display:flex; justify-content:flex-end; gap:8px">
                  <button class="btn btn-ghost" style="font-size:12px; padding:4px 10px">Edit</button>
                  <button class="btn btn-ghost" style="font-size:12px; padding:4px 10px; color:var(--color-danger)">Delete</button>
                </div>
              </td>
            </tr>
            <tr>
              <td><a href="#" style="font-weight:700">Uzbekistan National Cup 2025</a></td>
              <td class="text-muted">Samarkand</td>
              <td class="text-muted">03 Nov 2025</td>
              <td style="text-align:right">4</td>
              <td style="text-align:right">212</td>
              <td style="text-align:right">
                <div style="display:flex; justify-content:flex-end; gap:8px">
                  <button class="btn btn-ghost" style="font-size:12px; padding:4px 10px">Edit</button>
                  <button class="btn btn-ghost" style="font-size:12px; padding:4px 10px; color:var(--color-danger)">Delete</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;dark&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { themeOverride: null };
  renderVals() {
    const theme = this.state.themeOverride ?? this.props.theme ?? 'dark';
    return { theme, themeBtnLabel: theme === 'dark' ? 'Light mode' : 'Dark mode',
      toggleTheme: () => this.setState({ themeOverride: theme === 'dark' ? 'light' : 'dark' }) };
  }
}
</script>
</body>
</html>
