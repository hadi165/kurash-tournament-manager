# Kurash Competition Manager — nginx server block.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kurash
#   sudo ln -s /etc/nginx/sites-available/kurash /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue a certificate, which rewrites this file to add the TLS block:
#   sudo certbot --nginx -d kurash.example.org

server {
    listen 80;
    listen [::]:80;

    server_name kurash.example.org;

    # public/ only. The application code, .env and storage/ sit one level up and
    # are never reachable over HTTP — the single most important line here.
    root /var/www/kurash/current/public;
    index index.php;

    charset utf-8;

    client_max_body_size 12M;      # athlete photographs

    # Competition paperwork can be large and slow to build; a 60s ceiling is
    # generous for a PDF of a full championship and still bounds a hung worker.
    fastcgi_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite writes content-hashed filenames, so these can be cached hard.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-kurash.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing dotted is ever served, with the exception ACME needs to renew
    # the certificate.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/kurash-access.log;
    error_log  /var/log/nginx/kurash-error.log;
}
